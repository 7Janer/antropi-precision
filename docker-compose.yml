services:
  api-gateway:
    build: ./services/api-gateway
    environment:
      PORT: 8080
      ALLOWED_ORIGIN: http://localhost:3000
      COMPONENT_SERVICE_URL: http://component-service:8081
      AI_SERVICE_URL: http://ai-service:8082
      QUOTE_SERVICE_URL: http://quote-service:8083
    ports:
      - "8080:8080"
    depends_on:
      - component-service
      - ai-service
      - quote-service

  component-service:
    build: ./services/component-service
    environment:
      PORT: 8081

  ai-service:
    build: ./services/ai-service
    environment:
      PORT: 8082
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  quote-service:
    build: ./services/quote-service
    environment:
      PORT: 8083
